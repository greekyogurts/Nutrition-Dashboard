<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,500;1,8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#10130f; --panel:#171a15; --panel-raised:#1d2119; --row-alt:#151812;
    --border:#2a2e26; --border-soft:#20241d;
    --ink:#e8e3d4; --ink-dim:#8d9284; --ink-faint:#5d6255;
    --brass:#c39a5f; --brass-dim:#7a6440; --brass-wash: rgba(195,154,95,0.08);
    --moss:#8bab7c; --moss-wash: rgba(139,171,124,0.12);
    --clay:#c17a52; --clay-wash: rgba(193,122,82,0.12);
    --amber:#c9a355; --red:#bd5f56;
    --serif:'Source Serif 4', serif; --sans:'IBM Plex Sans', sans-serif; --mono:'IBM Plex Mono', monospace;
  }
  body.light{
    --bg:#f2ede1; --panel:#faf7ef; --panel-raised:#eee7d6; --row-alt:#eee8db;
    --border:#ddd3ba; --border-soft:#e5dcc7;
    --ink:#2a2620; --ink-dim:#6b6355; --ink-faint:#a89e88;
    --brass:#8a6a35; --brass-dim:#b89d6d; --brass-wash: rgba(138,106,53,0.08);
    --moss:#4f7a41; --moss-wash: rgba(79,122,65,0.10);
    --clay:#a1552f; --clay-wash: rgba(161,85,47,0.10);
    --amber:#93701f; --red:#a13d33;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ background:var(--bg); }
  body{ font-family:var(--sans); color:var(--ink); padding:32px 28px 60px; min-height:100vh; -webkit-font-smoothing:antialiased; }
  ::selection{ background:var(--brass-wash); color:var(--ink); }
  .wrap{ max-width:1220px; margin:0 auto; }

  header{ display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:14px; margin-bottom:30px; padding-bottom:20px; border-bottom:1px solid var(--border); }
  .title-row{ display:flex; flex-direction:column; gap:3px; }
  .eyebrow{ font-family:var(--mono); font-size:10.5px; letter-spacing:2.5px; text-transform:uppercase; color:var(--brass); }
  h1{ font-family:var(--serif); font-style:italic; font-weight:600; font-size:29px; letter-spacing:0.1px; line-height:1.1; color:var(--ink); }
  .header-right{ display:flex; flex-direction:row; align-items:center; gap:10px; }
  .live-badge{ display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-dim); border:1px solid var(--border); padding:5px 11px 5px 9px; border-radius:3px; }
  .live-dot{ width:6px; height:6px; border-radius:50%; background:var(--moss); animation:pulse 2.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }
  .theme-toggle{ font-family:var(--mono); font-size:11px; letter-spacing:0.3px; padding:6px 13px; border-radius:3px; border:1px solid var(--border); background:transparent; color:var(--ink-dim); cursor:pointer; transition:border-color 0.15s, color 0.15s; }
  .theme-toggle:hover{ border-color:var(--brass); color:var(--ink); }

  .range-toolbar{ display:flex; align-items:center; gap:6px; margin:22px 0 18px; flex-wrap:wrap; }
  .range-toolbar-label{ font-family:var(--mono); font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-faint); margin-right:6px; }
  .range-btn{ font-family:var(--mono); font-size:11px; letter-spacing:0.3px; padding:6px 13px; border-radius:3px; border:1px solid var(--border); background:transparent; color:var(--ink-dim); cursor:pointer; transition:border-color 0.15s, color 0.15s, background 0.15s; }
  .range-btn:hover{ border-color:var(--brass-dim); color:var(--ink); }
  .range-btn.active{ color:var(--brass); border-color:var(--brass); background:var(--brass-wash); font-weight:600; }

  .avgs{ display:flex; flex-wrap:wrap; gap:10px; margin:0 0 6px; transition:opacity 0.3s ease; }
  .avg-cell{ flex:1 1 100px; background:var(--panel); border:1px solid var(--border); border-top:2px solid var(--border-soft); padding:13px 12px 12px; text-align:left; position:relative; transition:border-color 0.2s ease; }
  .avgs.avgs-hero .avg-cell{ border-top-color:var(--brass); }
  .avg-cell:hover{ border-color:var(--brass-dim); }
  .avg-label{ font-family:var(--serif); font-style:italic; font-size:12px; color:var(--ink-dim); margin-bottom:7px; letter-spacing:0.2px; }
  .avg-value{ font-family:var(--mono); font-weight:600; font-size:19px; letter-spacing:-0.2px; color:var(--ink); }
  .avg-note{ font-family:var(--mono); font-size:10.5px; letter-spacing:0.3px; color:var(--ink-faint); text-align:left; margin-bottom:26px; }

  .table-container{ background:var(--panel); border:1px solid var(--border); overflow-x:auto; overflow-y:visible; }
  .table-container table{ width:100%; min-width:1150px; table-layout:fixed; border-collapse:separate; border-spacing:0; font-family:var(--mono); font-size:12px; }
  .table-container th:nth-child(1),  .table-container td:nth-child(1)  { width:7.5%; }
  .table-container th:nth-child(2),  .table-container td:nth-child(2)  { width:5.5%; }
  .table-container th:nth-child(3),  .table-container td:nth-child(3)  { width:6.5%; }
  .table-container th:nth-child(4),  .table-container td:nth-child(4)  { width:6.5%; }
  .table-container th:nth-child(5),  .table-container td:nth-child(5)  { width:8%; }
  .table-container th:nth-child(6),  .table-container td:nth-child(6)  { width:5%; }
  .table-container th:nth-child(7),  .table-container td:nth-child(7)  { width:5%; }
  .table-container th:nth-child(8),  .table-container td:nth-child(8)  { width:5%; }
  .table-container th:nth-child(9),  .table-container td:nth-child(9)  { width:5%; }
  .table-container th:nth-child(10), .table-container td:nth-child(10) { width:6.5%; }

async function fetchTable(table, order){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*&order=${order}`, {
    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
  });
  if(!res.ok) throw new Error(`Failed to load ${table} (${res.status})`);

function defLabel(d){ return d<0 ? `(${Math.round(Math.abs(d))})` : `${Math.round(d)}`; }

function labStatusClass(status){ return status.toLowerCase().includes('monitor') ? 'lab-monitor' : 'lab-good'; }

function sleepHoursLabel(h){ const hrs = Math.floor(h); const mins = Math.round((h - hrs) * 60); return `${hrs}h${mins}m`; }
function monthKey(dateStr){ return dateStr.slice(0,7); }
function monthLabel(key){ const [y,m] = key.split('-'); return new Date(Number(y), Number(m)-1, 1).toLocaleDateString('en-US',{month:'long',year:'numeric'}); }

function filterByRange(rows, range){
  if(rows.length === 0) return [];

  if(range === 'today') return [rows[rows.length-1]];

  const completeRows = rows.filter(r => r.is_complete !== false);
  if(completeRows.length === 0) return completeRows;

  if(range === 'all') return completeRows;

  if(range === '7d') return completeRows.slice(-7);
  if(range === '30d') return completeRows.slice(-30);

  if(range === 'ytd'){
    const refDate = new Date(Math.max(...completeRows.map(r => new Date(r.log_date+'T00:00:00'))));
    const cutoff = new Date(refDate.getFullYear(), 0, 1);
    return completeRows.filter(r => new Date(r.log_date+'T00:00:00') >= cutoff);
  }

  return completeRows;
}

      body.style.maxHeight = body.scrollHeight + 'px';
      body.style.opacity = '1';
      body.addEventListener('transitionend', function onEnd(e){
        if(e.propertyName !== 'max-height') return;
        body.style.maxHeight = 'none';
        body.removeEventListener('transitionend', onEnd);
      });
    } else {
      body.style.maxHeight = body.scrollHeight + 'px';

      body.style.maxHeight = '0px';
      body.style.opacity = '0';
      body.addEventListener('transitionend', function onEnd(e){

function sparklineSvg(values, w=60, h=20, color='currentColor'){
  if(!values || values.length < 2) return '';
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const step = w / (values.length - 1);
  const points = values.map((v,i) => `${(i*step).toFixed(1)},${(h - ((v-min)/range)*h).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;margin:4px auto 0;"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function animateCountUps(){
  document.querySelectorAll('[data-count]').forEach(el => {
    const target = Number(el.dataset.count);
    const suffix = el.dataset.suffix || '';
    if(isNaN(target)){ return; }
    const duration = 500;
    const start = performance.now();
    function tick(now){
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      const val = Math.round(target * eased);
      el.textContent = val + suffix;
      if(progress < 1) requestAnimationFrame(tick);
      else el.textContent = target + suffix;
    }
    requestAnimationFrame(tick);
  });
}

function renderHeatmap(){
  const grid = document.getElementById('heatmapGrid');
  if(!grid) return;

  if(allLog.length === 0){
    grid.parentElement.innerHTML = `<div style="color:var(--ink-dim); font-size:12px;">No data yet.</div>`;
    return;
  }

  const endDate = new Date(allLog[allLog.length - 1].log_date + 'T00:00:00');
  const earliestTracked = new Date(allLog[0].log_date + 'T00:00:00');
  const lookback = new Date(endDate);
  lookback.setDate(lookback.getDate() - 83);
  const start = lookback > earliestTracked ? lookback : earliestTracked;
  start.setDate(start.getDate() - start.getDay());

  const byDate = {};
  allLog.forEach(r => { byDate[r.log_date] = r; });

  function toKey(d){ return d.toISOString().slice(0,10); }
  function deficitLevel(row){
    if(!row) return 'hm-0';
    const sd = Number(row.surplus_deficit);
    if(isNaN(sd)) return 'hm-0';
    if(sd >= 0) return 'hm-surplus';
    const mag = Math.abs(sd);
    if(mag < 250) return 'hm-1';
    if(mag < 600) return 'hm-2';
    if(mag < 1000) return 'hm-3';
    return 'hm-4';
  }

  const cols = [];
  const monthLabels = [];
  let cursor = new Date(start);
  let lastMonth = null;

  while(cursor <= endDate){
    const colCells = [];
    for(let dow = 0; dow < 7; dow++){
      const key = toKey(cursor);
      if(cursor > endDate){
        colCells.push(`<i class="heatmap-cell hm-future"></i>`);
      } else {
        const row = byDate[key];
        const level = deficitLevel(row);
        const label = row ? `${fmt(key)}: ${row.surplus_deficit >= 0 ? '+' : ''}${row.surplus_deficit} cal` : `${fmt(key)}: no data`;
        colCells.push(`<i class="heatmap-cell ${level}" title="${label}" onclick="showHeatmapDay('${key}')"></i>`);
      }
      cursor.setDate(cursor.getDate() + 1);
    }
    const colMonth = cursor.getMonth();
    if(colMonth !== lastMonth){
      monthLabels.push(cursor.toLocaleDateString('en-US', { month: 'short' }));
      lastMonth = colMonth;
    } else {
      monthLabels.push('');
    }
    cols.push(`<div class="heatmap-col">${colCells.join('')}</div>`);
  }

  grid.innerHTML = cols.join('');

  const monthLabelsEl = document.getElementById('heatmapMonthLabels');
  if(monthLabelsEl){
    monthLabelsEl.innerHTML = monthLabels.map(m =>
      `<span style="width:11px; flex-shrink:0; white-space:nowrap; overflow:visible;">${m}</span>`
    ).join('');
  }
}

function renderMicronutrients(micros, dayRows){
  micros = micros || allMicros;
  dayRows = dayRows || allLog;
  const grid = document.getElementById('microGrid');
  if(dayRows.length === 0){
    grid.innerHTML = `<div style="grid-column:1/-1;color:var(--ink-dim);padding:10px 0;">No micronutrient data logged yet for this view &mdash; this section fills in as more days get tracked.</div>`;
    return;
  }

  const trackingStartDate = allMicros.length > 0
    ? allMicros.reduce((min, m) => m.log_date < min ? m.log_date : min, allMicros[0].log_date)
    : null;
  const trackedDayRows = trackingStartDate
    ? dayRows.filter(r => r.log_date >= trackingStartDate)
    : dayRows;
  const totalDays = trackedDayRows.length || 1;

  const byNutrient = {};
  const bySource = {};
  micros.forEach(m => {
    if(!byNutrient[m.nutrient]) byNutrient[m.nutrient] = {};
    const day = m.log_date;
    byNutrient[m.nutrient][day] = (byNutrient[m.nutrient][day] || 0) + Number(m.amount);

    if(!bySource[m.nutrient]) bySource[m.nutrient] = { food: 0, supplement: 0 };
    const src = m.source === 'supplement' ? 'supplement' : 'food';
    bySource[m.nutrient][src] += Number(m.amount);
  });

  const cards = MICRO_ORDER.map(nutrient => {
    const dayTotals = Object.values(byNutrient[nutrient] || {});
    const dayCount = totalDays;
    const loggedDays = dayTotals.length;
    const avg = dayTotals.reduce((a,b)=>a+b,0) / dayCount;
    const ref = MICRO_REFERENCE[nutrient];
    const daysLabel = dayCount > 1 ? `avg of ${dayCount} days` : '';

    const src = bySource[nutrient] || { food: 0, supplement: 0 };
    const foodAvg = src.food / dayCount;
    const suppAvg = src.supplement / dayCount;

    function fmtAmt(n){ return n < 10 ? n.toFixed(1) : Math.round(n); }

    function bar(label, target, pct){
      return `
        <div class="micro-bar-row">
          <div class="micro-bar-label"><span>${label}</span><span>${Math.round(pct)}%</span></div>
          <div class="micro-bar-track"><div class="micro-bar-fill ${target === 'rda' ? 'micro-bar-fill-rda' : 'micro-bar-fill-optimal'}" style="width:${Math.min(pct,100)}%"></div></div>
        </div>`;
    }

    function sourceLine(target){
      if(foodAvg <= 0 && suppAvg <= 0) return '';
      if(suppAvg <= 0) return `${fmtAmt(foodAvg)}${ref.unit} from food &middot; 0${ref.unit} from supplement`;
      const foodPctOfTarget = target > 0 ? Math.round((foodAvg / target) * 100) : null;
      const foodNote = foodPctOfTarget !== null ? ` (${foodPctOfTarget}% of target alone)` : '';
      return `${fmtAmt(foodAvg)}${ref.unit} from food${foodNote} &middot; ${fmtAmt(suppAvg)}${ref.unit} from supplement`;
    }

    if(ref.isRange){
      const belowRange = avg < ref.low;
      const aboveRange = avg > ref.high;
      const noteText = belowRange ? ref.belowNote : aboveRange ? ref.aboveNote : ref.withinNote;
      const pctOfHigh = (avg / ref.high) * 100;
      const sourceText = sourceLine(ref.high);
      return `
        <div class="micro-card">
          <div class="micro-name">${nutrient}${ref.isSubcategory ? '<span class="micro-subcat-tag">Subcategory of Fat</span>' : ''}</div>
          <div class="micro-avg">${avg < 10 ? avg.toFixed(1) : Math.round(avg)} ${ref.unit}<span style="font-size:10px;color:var(--ink-faint);font-weight:400;"> avg/day</span></div>
          ${bar(`${ref.rangeLabel} (${ref.low.toLocaleString()}&ndash;${ref.high.toLocaleString()}${ref.unit})`, 'optimal', pctOfHigh)}
          <div class="micro-note">${noteText}</div>
          ${ref.isSubcategory ? `<div class="micro-note" style="margin-top:4px; font-style:italic;">Not a true vitamin/mineral &mdash; an essential fatty acid, grouped with fat on nutrition labels. Tracked here for convenience since it's diet-relevant for you.</div>` : ''}
          ${sourceText ? `<div class="micro-note" style="margin-top:4px;">${sourceText}</div>` : ''}
          ${daysLabel ? `<div class="micro-days">${daysLabel}</div>` : ''}
        </div>`;
    }

    const pctRda = (avg / ref.rda) * 100;
    const pctOptimal = (avg / ref.optimal) * 100;
    const sourceText = sourceLine(ref.rda);
    return `
      <div class="micro-card">
        <div class="micro-name">${nutrient}</div>
        <div class="micro-avg">${avg < 10 ? avg.toFixed(1) : Math.round(avg)} ${ref.unit}<span style="font-size:10px;color:var(--ink-faint);font-weight:400;"> avg/day</span></div>
        ${bar(`vs. RDA (${ref.rda}${ref.unit})`, 'rda', pctRda)}
        ${bar(`vs. Optimal (${ref.optimal}${ref.unit})`, 'optimal', pctOptimal)}
        ${sourceText ? `<div class="micro-note">${sourceText}</div>` : ''}
        ${daysLabel ? `<div class="micro-days">${daysLabel}</div>` : ''}
      </div>`;
  }).join('');

  grid.innerHTML = cards || `<div style="grid-column:1/-1;color:var(--ink-dim);">No micronutrient data logged yet.</div>`;
}

function pearson(xs, ys){
  const n = xs.length;
  const mx = xs.reduce((a,b)=>a+b,0)/n;
  const my = ys.reduce((a,b)=>a+b,0)/n;
  let cov = 0, vx = 0, vy = 0;
  for(let i=0;i<n;i++){ cov += (xs[i]-mx)*(ys[i]-my); vx += (xs[i]-mx)**2; vy += (ys[i]-my)**2; }
  if(vx === 0 || vy === 0) return 0;
  return cov / Math.sqrt(vx*vy);
}

function renderTakeaways(rows, activities){
  activities = activities || [];
  const n = rows.length;
  const grid = document.getElementById('takeawaysGrid');
  if(n === 0){
    grid.innerHTML = `<div class="takeaway-card" style="grid-column:1/-1;color:var(--ink-dim);">No complete days in this range to analyze.</div>`;
    return;
  }

  const cards = [];
  const singleDay = n === 1;

  const variances = rows.map(r => Number(r.surplus_deficit));
  const avgVar = variances.reduce((a,b)=>a+b,0)/n;
  const totalVar = variances.reduce((a,b)=>a+b,0);
  const isDeficit = avgVar < 0;
  const deficitDays = variances.filter(v => v < 0).length;
  cards.push({
    label: 'Net Calorie Balance',
    value: `${isDeficit ? 'Deficit' : 'Surplus'} of ${Math.round(Math.abs(avgVar))} cal${singleDay ? '' : '/day'}`,
    detail: singleDay
      ? `Calories ${isDeficit ? 'under' : 'over'} TDEE for this day.`
      : `${deficitDays} of ${n} days in deficit &middot; net ${isDeficit ? 'deficit' : 'surplus'} of ${Math.round(Math.abs(totalVar)).toLocaleString()} cal across the range &asymp; ${(Math.abs(totalVar)/3500).toFixed(1)} lb of body-weight impact.`
  });

  const proteinVals = rows.map(r => Number(r.protein_g));
  const avgProtein = proteinVals.reduce((a,b)=>a+b,0)/n;
  const proteinHits = proteinVals.filter(p => p >= 180).length;
  cards.push({
    label: 'Protein Delivery',
    value: `${Math.round(avgProtein)}g${singleDay ? '' : '/day avg'}`,
    detail: singleDay
      ? `About ${(avgProtein / (Number(rows[0].weight_lb) || 177)).toFixed(2)}g per lb of body weight &mdash; well into the muscle-retention zone for a cut.`
      : `Hit 180g+ on ${proteinHits} of ${n} days &mdash; ${proteinHits/n >= 0.9 ? 'extremely consistent' : proteinHits/n >= 0.7 ? 'mostly consistent' : 'room to tighten up'} for muscle retention while cutting.`
  });

  const sleepVals = rows.map(r => Number(r.sleep_hours));
  const scoreVals = rows.map(r => Number(r.score));
  const sleepVaries = new Set(sleepVals).size > 1;
  const scoreVaries = new Set(scoreVals).size > 1;
  if(n >= 4 && sleepVaries && scoreVaries){
    const r = pearson(sleepVals, scoreVals);
    const strength = Math.abs(r) >= 0.6 ? 'strong' : Math.abs(r) >= 0.3 ? 'moderate' : 'weak';
    const direction = r >= 0 ? 'positive' : 'negative';
    const avgSleep = sleepVals.reduce((a,b)=>a+b,0)/n;
    cards.push({
      label: 'Sleep & Performance',
      value: `${strength.charAt(0).toUpperCase()+strength.slice(1)} ${direction} link`,
      detail: `Sleep duration and Sleep Score correlate at r = ${r.toFixed(2)} over this period, on ${sleepHoursLabel(avgSleep)} average sleep &mdash; ${Math.abs(r) >= 0.3 ? 'duration is genuinely moving your score' : 'other factors (timing, consistency) may matter more than raw duration right now'}.`
    });
  } else {
    const avgSleep = sleepVals.reduce((a,b)=>a+b,0)/n;
    cards.push({
      label: 'Sleep',
      value: `${sleepHoursLabel(avgSleep)}${singleDay ? '' : ' avg'}`,
      detail: singleDay
        ? `Sleep Score ${rows[0].score}. More days needed to correlate sleep with performance.`
        : `More days with varied sleep needed for a reliable duration-vs-score trend.`
    });
  }

  const hrvVals = rows.map(r => Number(r.hrv));
  const rhrVals = rows.map(r => Number(r.rhr));
  if(n >= 6){
    const half = Math.floor(n/2);
    const hrvFirst = hrvVals.slice(0, half).reduce((a,b)=>a+b,0)/half;
    const hrvSecond = hrvVals.slice(-half).reduce((a,b)=>a+b,0)/half;
    const rhrFirst = rhrVals.slice(0, half).reduce((a,b)=>a+b,0)/half;
    const rhrSecond = rhrVals.slice(-half).reduce((a,b)=>a+b,0)/half;
    const hrvDelta = hrvSecond - hrvFirst;
    const rhrDelta = rhrSecond - rhrFirst;
    const improving = hrvDelta > 1 && rhrDelta < 0.5;
    const declining = hrvDelta < -3 || rhrDelta > 1;
    cards.push({
      label: 'Recovery Trend',
      value: improving ? 'Improving' : declining ? 'Worth watching' : 'Stable',
      detail: `HRV ${hrvDelta >= 0 ? 'up' : 'down'} ${Math.abs(hrvDelta).toFixed(0)}ms and RHR ${rhrDelta >= 0 ? 'up' : 'down'} ${Math.abs(rhrDelta).toFixed(1)}bpm comparing the back half of this range to the front half${declining ? ' &mdash; could reflect accumulating training load, stress, or short sleep' : ''}.`
    });
  } else {
    const avgHrv = hrvVals.reduce((a,b)=>a+b,0)/n;
    const avgRhr = rhrVals.reduce((a,b)=>a+b,0)/n;
    cards.push({
      label: 'Recovery',
      value: `HRV ${Math.round(avgHrv)} / RHR ${Math.round(avgRhr)}`,
      detail: `${singleDay ? "This day's" : 'Average'} readings. An RHR in the mid-40s is an athlete-level baseline.`
    });
  }

  if(activities.length > 0){
    const totalMin = activities.reduce((s,a)=>s+Number(a.duration_min),0);
    const totalBurn = activities.reduce((s,a)=>s+Number(a.calories||0),0);
    const typeCounts = {};
    activities.forEach(a => { typeCounts[a.sport_type] = (typeCounts[a.sport_type]||0)+1; });
    const topType = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1])[0];
    const typeNames = { 'Run':'runs', 'Ride':'Peloton rides', 'WeightTraining':'lifting sessions', 'Walk':'walks' };
    const hrActs = activities.filter(a => a.avg_hr);
    const avgHr = hrActs.length ? hrActs.reduce((s,a)=>s+Number(a.avg_hr),0)/hrActs.length : null;
    cards.push({
      label: 'Training Load',
      value: `${activities.length} workout${activities.length>1?'s':''} &middot; ${Math.round(totalMin)} min`,
      detail: `${totalBurn.toLocaleString()} cal burned${avgHr ? ` at ${Math.round(avgHr)} bpm average` : ''}. Most frequent: ${typeNames[topType[0]] || topType[0]} (${topType[1]}x).`
    });
  } else {
    cards.push({
      label: 'Training Load',
      value: 'No workouts',
      detail: 'No tracked activities in this range - rest days or unsynced sessions.'
    });
  }

  const rangeStart = rows[0].log_date;
  const rangeEnd = rows[rows.length-1].log_date;
  const microsInRange = (allMicros||[]).filter(m => m.log_date >= rangeStart && m.log_date <= rangeEnd);
  if(microsInRange.length > 0){
    const byNutrient = {};
    microsInRange.forEach(m => {
      if(!byNutrient[m.nutrient]) byNutrient[m.nutrient] = {};
      byNutrient[m.nutrient][m.log_date] = (byNutrient[m.nutrient][m.log_date]||0) + Number(m.amount);
    });
    let worst = null, best = null;
    Object.entries(byNutrient).forEach(([nutrient, days]) => {
      const ref = MICRO_REFERENCE[nutrient];
      if(!ref || ref.isRange) return;
      const vals = Object.values(days);
      const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
      const pct = (avg/ref.rda)*100;
      if(!worst || pct < worst.pct) worst = { nutrient, pct, avg, unit: ref.unit };
      if(!best || pct > best.pct) best = { nutrient, pct };
    });
    if(worst){
      cards.push({
        label: 'Micronutrient Watch',
        value: `${worst.nutrient} at ${Math.round(worst.pct)}%`,
        detail: `Lowest vs. RDA in this range (${worst.avg < 10 ? worst.avg.toFixed(1) : Math.round(worst.avg)}${worst.unit}/day avg). Strongest: ${best.nutrient} at ${Math.round(best.pct)}%. Micronutrient logging began Jul 13, so early ranges have thin data.`
      });
    }
  } else {
    cards.push({
      label: 'Micronutrient Watch',
      value: 'No data in range',
      detail: 'Micronutrient logging began Jul 13 - this card fills in as tracked days accumulate.'
    });
  }

  grid.innerHTML = cards.map(c => `
    <div class="takeaway-card">
      <div class="takeaway-label">${c.label}</div>
      <div class="takeaway-value">${c.value}</div>
      <div class="takeaway-detail">${c.detail}</div>
    </div>
  `).join('');
}

  return `<div class="charts-grid">${cards}</div>`;

function formatPace(durationMin, distanceMi){
  if(!distanceMi || distanceMi <= 0) return null;
  const paceMin = durationMin / distanceMi;
  const min = Math.floor(paceMin);
  const sec = Math.round((paceMin - min) * 60);
  return `${min}:${String(sec).padStart(2,'0')}/mi`;
}

function renderWorkoutCards(activities){
  if(activities.length === 0){
    return `<div style="padding:20px 4px; color:var(--ink-dim); font-size:13px;">No workouts logged for this day &mdash; rest day.</div>`;
  }
  const sorted = [...activities].sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
  const cards = sorted.map(a => {
    const stats = [];
    if(a.duration_min) stats.push({ label:'Duration', value: `${Math.round(a.duration_min)} min` });
    if(a.distance_mi) stats.push({ label:'Distance', value: `${Number(a.distance_mi).toFixed(2)} mi` });
    const pace = formatPace(a.duration_min, a.distance_mi);
    if(pace && ['Run','Walk'].includes(a.sport_type)) stats.push({ label:'Pace', value: pace });
    if(a.elevation_gain_ft) stats.push({ label:'Elevation', value: `${Math.round(a.elevation_gain_ft)} ft` });
    if(a.avg_hr) stats.push({ label:'Avg HR', value: `${Math.round(a.avg_hr)} bpm` });
    if(a.max_hr) stats.push({ label:'Max HR', value: `${Math.round(a.max_hr)} bpm` });
    if(a.avg_watts) stats.push({ label:'Avg Watts', value: `${Math.round(a.avg_watts)}w` });
    if(a.calories) stats.push({ label:'Calories', value: `${Math.round(a.calories)}` });
    if(a.relative_effort != null) stats.push({ label:'Training Impact', value: `${a.relative_effort}` });

    const statGrid = stats.map(s => `
      <div>
        <div style="font-size:10.5px; text-transform:uppercase; letter-spacing:0.3px; color:var(--ink-faint); margin-bottom:2px;">${s.label}</div>
        <div style="font-size:15px; font-weight:600;">${s.value}</div>
      </div>`).join('');

    return `
      <div class="chart-card" style="padding:16px;">
        <h3 style="display:flex; justify-content:space-between; align-items:baseline;">
          <span>${a.name || a.sport_type}</span>
          <span style="text-transform:none; color:var(--ink-faint); font-size:11.5px; font-weight:400;">${a.sport_type}</span>
        </h3>
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(80px, 1fr)); gap:12px; margin-top:6px;">
          ${statGrid}
        </div>
      </div>`;
  }).join('');
  return `<div class="charts-grid">${cards}</div>`;
}

function renderActivityCharts(activities){
  try{
    if(typeof Chart === 'undefined'){ console.warn('Chart.js failed to load; skipping activity charts.'); return; }

    ['volume','typeBreakdown','burn','activityHR'].forEach(k => {
      if(chartRefs[k]){ chartRefs[k].destroy(); chartRefs[k] = null; }
    });

    const grid = document.getElementById('activityChartsGrid');
    const emptyMsg = document.getElementById('activityEmptyMsg');
    const distinctDays = new Set(activities.map(a => a.log_date)).size;

    if(distinctDays < 2){
      if(grid) grid.style.display = 'none';
      if(emptyMsg){
        emptyMsg.style.display = 'block';
        emptyMsg.innerHTML = `
          <div style="margin-bottom:12px;">Activity trend charts need at least 2 days of workout data &mdash; here's today's workout detail instead.
            <button type="button" onclick="goToRange('7d')" style="margin-left:6px; background:var(--brass); color:var(--bg); border:none; border-radius:3px; padding:4px 10px; font-size:12.5px; font-weight:600; cursor:pointer;">View Last 7 Days</button>
          </div>
          ${renderWorkoutCards(activities)}
        `;
      }
      return;
    }
    if(grid) grid.style.display = '';
    if(emptyMsg) emptyMsg.style.display = 'none';

    Chart.defaults.color = cssVar('--ink-dim');
    Chart.defaults.font.family = "'IBM Plex Sans', sans-serif";
    Chart.defaults.font.size = 10;

    if(activities.length === 0) return;

    const gridColor = cssVar('--border');
    const brand = cssVar('--brass');
    const good = cssVar('--moss');
    const red = cssVar('--red');
    const purple = '#a495c9';
    const neutral = cssVar('--ink-dim');

    const typeColors = {
      'Run': brand,
      'Ride': red,
      'WeightTraining': good,
      'Walk': purple
    };
    const typeLabels = {
      'Run': 'Run',
      'Ride': 'Peloton/Ride',
      'WeightTraining': 'Weight Training',
      'Walk': 'Walk'
    };
    function colorFor(type){ return typeColors[type] || neutral; }
    function labelFor(type){ return typeLabels[type] || type; }

    function baseScales(extra={}, labelArr=null){
      return {
        x:{
          grid:{ color: gridColor },
          ticks:{ maxRotation:0, autoSkip:true, maxTicksLimit:9 },
          afterBuildTicks:(axis) => {
            const arr = labelArr || labels;
            const lastIdx = arr.length - 1;
            if(lastIdx >= 0 && !axis.ticks.some(t => t.value === lastIdx)){
              axis.ticks.push({ value: lastIdx });
            }
          }
        },
        y:{ grid:{ color: gridColor }, ...extra }
      };
    }
    const dates = [...new Set(activities.map(a => a.log_date))].sort();
    const labels = dates.map(fmt);
    const sportTypes = [...new Set(activities.map(a => a.sport_type))];
    const volumeDatasets = sportTypes.map(type => ({
      label: labelFor(type),
      data: dates.map(d => {
        const matches = activities.filter(a => a.log_date === d && a.sport_type === type);
        return matches.reduce((s,a) => s + Number(a.duration_min), 0);
      }),
      backgroundColor: colorFor(type),
      borderRadius:1
    }));

    chartRefs.volume = new Chart(document.getElementById('chartVolume'), {
      type:'bar',
      data:{ labels, datasets: volumeDatasets },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'top', labels:{ boxWidth:10, padding:8 } } },
        scales:{
          x:{
            grid:{ color: gridColor },
            stacked:true,
            ticks:{ maxRotation:0, autoSkip:true, maxTicksLimit:9 },
            afterBuildTicks:(axis) => {
              const lastIdx = labels.length - 1;
              if(lastIdx >= 0 && !axis.ticks.some(t => t.value === lastIdx)){
                axis.ticks.push({ value: lastIdx });
              }
            }
          },
          y:{ grid:{ color: gridColor }, stacked:true, title:{ display:true, text:'Minutes' } }
        }
      }
    });

    const typeTotals = sportTypes.map(type => ({
      type,
      minutes: activities.filter(a => a.sport_type === type).reduce((s,a) => s + Number(a.duration_min), 0)
    }));

    chartRefs.typeBreakdown = new Chart(document.getElementById('chartTypeBreakdown'), {
      type:'doughnut',
      data:{
        labels: typeTotals.map(t => labelFor(t.type)),
        datasets:[{
          data: typeTotals.map(t => Math.round(t.minutes)),
          backgroundColor: typeTotals.map(t => colorFor(t.type)),
          borderColor: cssVar('--panel'),
          borderWidth:2
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'right', labels:{ boxWidth:10, padding:8, font:{size:10} } } }
      }
    });

    const burnDatasets = [{
      label:'Calories Burned',
      data: dates.map(d => activities.filter(a => a.log_date === d).reduce((s,a) => s + Number(a.calories||0), 0)),
      backgroundColor: brand + 'aa',
      borderRadius:1
    }];
    chartRefs.burn = new Chart(document.getElementById('chartBurn'), {
      type:'bar',
      data:{ labels, datasets: burnDatasets },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales: baseScales() }
    });

    const hrActivities = activities.filter(a => a.avg_hr !== null && a.avg_hr !== undefined);
    const hrLabels = hrActivities.map(a => fmt(a.log_date));
    chartRefs.activityHR = new Chart(document.getElementById('chartActivityHR'), {
      type:'line',
      data:{
        labels: hrLabels,
        datasets:[{
          label:'Avg HR',
          data: hrActivities.map(a => Math.round(a.avg_hr)),
          borderColor: red,
          backgroundColor: hrActivities.map(a => colorFor(a.sport_type)),
          pointRadius:4,
          pointHoverRadius:6,
          borderWidth:2,
          tension:0.2,
          segment:{ borderColor: red }
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display:false } },
        scales: baseScales({ title:{ display:true, text:'BPM' } }, hrLabels)
      }
    });

  } catch(err){
    console.error('Activity chart rendering failed:', err);
  }
}

function setupThemeToggle(){
  const btn = document.getElementById('themeToggle');
  const isLight = document.body.classList.contains('light');
  btn.textContent = isLight ? 'Light' : 'Dark';

  btn.addEventListener('click', () => {
    const nowLight = document.body.classList.toggle('light');
    btn.textContent = nowLight ? 'Light' : 'Dark';
    try{ localStorage.setItem('nutritionDashboardTheme', nowLight ? 'light' : 'dark'); }catch(e){}
    renderCharts(lastCompleteRows, lastMealRows, lastMealItemRows);
    renderActivityCharts(lastActivityRows);
  });
}

setupThemeToggle();
init();
</script>

</html>
