<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- initial-scale=0.9, not 1: the whole app renders ~10% smaller/denser
         by default, matching a manual pinch-out. This is `initial-scale`
         rather than a CSS `zoom` transform specifically because
         `visualViewport` (which the JS height-sync hooks read — see
         useVisualViewportHeight) tracks the browser's real pinch-zoom scale,
         not an arbitrary element's CSS `zoom`; using the same mechanism the
         rest of the app already depends on means no extra compensation code
         is needed for layout. Text inputs *do* need compensating for this —
         see the input/select/textarea rule in styles.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=0.9, viewport-fit=cover" />
    <!-- Backstop for iOS Safari's input-focus auto-zoom, on top of every
         input already being 16px+ rendered (see styles.css). 16px is
         supposed to be sufficient on its own, but real-device reports of
         this still happening are exactly what this exists to catch —
         capping the zoom ceiling at 1x makes the zoom impossible outright,
         regardless of why it was triggering. iOS only, and JS- rather than
         meta-tag-set: applying `maximum-scale=1` globally blocks pinch-zoom
         on Android too, which is a real accessibility regression (WCAG
         1.4.4) that iOS's own auto-zoom quirk doesn't justify inflicting on
         every other platform. https://weblog.west-wind.com/posts/2023/Apr/17/Preventing-iOS-Textbox-Auto-Zooming-and-ViewPort-Sizing -->
    <script>
      if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
        document
          .querySelector('meta[name="viewport"]')
          .setAttribute('content', 'width=device-width, initial-scale=0.9, maximum-scale=1, viewport-fit=cover');
      }
    </script>
    <meta name="theme-color" content="#000000" />
    <title>Health Dashboard</title>
    <meta name="description" content="Personal dashboard for nutrition, training, sleep and lab results." />

    <!-- The app is invite-only and behind a sign-in, so there is nothing here
         for a search engine to index; the OG tags exist only so a link shared
         to yourself renders as something other than a bare URL. -->
    <meta name="robots" content="noindex" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Health Dashboard" />
    <meta property="og:description" content="Personal dashboard for nutrition, training, sleep and lab results." />
    <meta property="og:image" content="/icons/icon-512.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS ignores the manifest for standalone/status-bar behavior when
         launched from the home screen; these are the actual switches. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Health" />
  </head>
  <body>
    <!--
      The React app's entry point. Through phase 4 this file was app.html,
      kept separate from the vanilla dashboard's index.html so `npm run dev`
      could show both side by side for parity checking. At the phase 5
      cutover this file took over index.html; the vanilla single-file
      dashboard it replaced is preserved at commit c804533 (tag it yourself
      with `git tag pre-react-cutover c804533` if you want a named ref).
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
