# Builds and deploys the React dashboard to GitHub Pages.
#
# Requires the repo's Pages source to be set to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source). Until that's
# switched, this workflow can run and produce an artifact, but Pages keeps
# serving whatever the previous source was configured to serve.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push supersedes an in-flight one
# rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stamp the service worker cache name with this commit
        run: sed -i "s/__BUILD_ID__/${{ github.sha }}/" public/sw.js
      - run: npx vite build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
