# Typecheck, unit tests, and a production build on every push and PR.
#
# Deliberately does NOT deploy -- that's deploy.yml, which runs on pushes to
# main once the repo's Pages source is set to "GitHub Actions".
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        # Pinned east of UTC (not the runner's default UTC, and not a
        # west-of-UTC zone like US time, which happens to mask a local-vs-UTC
        # Date mixup the way buildHeatmap's timezone bug once did) so any
        # future local/UTC Date mixup fails here instead of only for
        # real users east of Greenwich.
        run: npm test
        env:
          TZ: Asia/Tokyo
      - name: Build
        run: npx vite build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
