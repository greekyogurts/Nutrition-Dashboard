<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Health Dashboard</title>
    <meta name="description" content="Personal dashboard for nutrition, training, sleep and lab results." />

    <!-- The app is invite-only and behind a sign-in, so there is nothing here
         for a search engine to index; the OG tags exist only so a link shared
         to yourself renders as something other than a bare URL. -->
    <meta name="robots" content="noindex" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Health Dashboard" />
    <meta property="og:description" content="Personal dashboard for nutrition, training, sleep and lab results." />
    <meta property="og:image" content="/icons/icon-512.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS ignores the manifest for standalone/status-bar behavior when
         launched from the home screen; these are the actual switches. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Health" />
  </head>
  <body>
    <!--
      The React app's entry point. Through phase 4 this file was app.html,
      kept separate from the vanilla dashboard's index.html so `npm run dev`
      could show both side by side for parity checking. At the phase 5
      cutover this file took over index.html; the vanilla single-file
      dashboard it replaced is preserved at commit c804533 (tag it yourself
      with `git tag pre-react-cutover c804533` if you want a named ref).
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
