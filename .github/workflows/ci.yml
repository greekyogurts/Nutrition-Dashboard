# Typecheck, unit tests, and a production build on every push and PR.
#
# Deliberately does NOT deploy -- that's deploy.yml, which runs on pushes to
# main once the repo's Pages source is set to "GitHub Actions".
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build
